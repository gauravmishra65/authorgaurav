<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101827" />
    <link rel="icon" type="image/png" href="/images/brand/cat-mark.png" />
    <title data-default>Gaurav Mishra | Author of Shadow Code, Offbeat Love and Spiritual Books</title>
    <meta name="description" data-default content="Explore books by Gaurav Mishra, including the techno-financial thriller Shadow Code, contemporary fiction and accessible spiritual books in Hindi and English." />
    <meta property="og:title" content="Gaurav Mishra | Author of Shadow Code, Offbeat Love and Spiritual Books" />
    <meta property="og:description" content="Explore books by Gaurav Mishra, including the techno-financial thriller Shadow Code, contemporary fiction and accessible spiritual books in Hindi and English." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://authorgaurav.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Fonts are self-hosted (src/fonts.css, public/fonts). Only the two faces every page
         paints above the fold are preloaded; the Devanagari faces download on demand. -->
    <link rel="preload" href="/fonts/fraunces-normal-300-700-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-normal-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Every page fetches its content (books/blog/testimonials/etc.) from
         Supabase immediately on load — preconnecting here lets the browser
         do the DNS/TLS handshake in parallel with JS parsing instead of
         only starting once the first fetch() call actually runs. The href
         below is Vite's own build-time env-variable substitution syntax for
         index.html, so this stays correct if the Supabase project changes. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <!-- Person + WebSite JSON-LD used to be hardcoded here, present on every
         route (this file is the shared shell) and duplicating/conflicting
         with the page-specific structured data React injects via Seo's
         jsonLd prop. Now sourced from one place, src/components/
         PersonStructuredData.tsx (built from src/data/author.ts and
         src/data/social.ts), and rendered only on the two pages that
         actually need to declare the full author entity: Home ("/") and
         About ("/about/"). See buildJsonLd() in each of those files. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
