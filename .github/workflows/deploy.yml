name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # @supabase/supabase-js now requires Node >=22, and package-lock.json
          # was written by npm 11.x — Node 20's bundled npm 10.8.2 read it as
          # out of sync (`npm ci` failed: "Missing: esbuild@0.28.1 from lock
          # file"). Node 24 is what actually generated this lockfile locally,
          # so it's the version guaranteed to read it back correctly.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          # Set both in repo Settings > Secrets and variables > Actions — the
          # site fetches its content (books/blog/news/testimonials) from
          # Supabase at runtime, so the build needs these to embed correctly.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
