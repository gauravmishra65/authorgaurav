name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # @supabase/supabase-js now requires Node >=22, and package-lock.json
          # was written by npm 11.x — Node 20's bundled npm 10.8.2 read it as
          # out of sync (`npm ci` failed: "Missing: esbuild@0.28.1 from lock
          # file"). Node 24 is what actually generated this lockfile locally,
          # so it's the version guaranteed to read it back correctly.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      # The chromium install above existed for a while with nothing actually
      # calling test:e2e — the 125-test accessibility/smoke suite (0
      # critical/serious violations across 27 routes) was running locally
      # but had zero CI enforcement, so a real regression could merge
      # silently. Needs the same Supabase env as build: Playwright's own
      # webServer starts `npm run dev` fresh in CI (reuseExistingServer is
      # false whenever process.env.CI is set — see playwright.config.ts),
      # and the dev server fetches real book/blog/event data the same way
      # the production build does.
      - run: npm run test:e2e
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # Content-completeness gate (featured book with no purchase link,
      # missing SEO fields on a published book, a readerMagnets fileUrl
      # pointing at a file that doesn't exist, etc.) — reads live Supabase
      # data directly, doesn't need dist/ to exist yet.
      - run: npm run validate:content
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - run: npm run build
        env:
          # Set both in repo Settings > Secrets and variables > Actions — the
          # site fetches its content (books/blog/news/testimonials) from
          # Supabase at runtime, so the build needs these to embed correctly.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # Link/asset/canonical/sitemap auditor — checks the *built* dist/
      # output, so it must run after build, not before.
      - run: npm run validate:links
      # Per-page SEO auditor (title, description, single canonical matching the
      # sitemap, Open Graph, one H1, valid JSON-LD, no stray noindex) over the
      # built pages. validate:production-seo is the live-site counterpart and
      # is run by hand after a deploy, since nothing is live yet at this point.
      - run: npm run validate:build-seo
      # Exercises the pre-rendered page -> live app swap (src/main.tsx) on the
      # production build, which the dev-server e2e suite above never reaches:
      # one H1 after the swap, no console errors, layout shift under 0.25,
      # working menu and active-nav highlight on the canonical slashed URL.
      - run: npm run test:e2e:prerendered
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
